<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
    <meta name="googlebot" content="noindex, nofollow">
    <title>Administracao marcenaria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .nota {
            background: #f4f4f4;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .data {
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>Oficina</h1>

    <textarea id="textoNota" placeholder="Escreva uma anotação..."></textarea>
    <button onclick="salvarNota()">Salvar Anotação será?</button>

    <h2>Anotações Salvas</h2>
    <div id="listaNotas">Carregando...</div>

    <script>        
        const API_URL = "/api";

        async function carregarNotas() {
            try {
                const res = await fetch(`${API_URL}/anotacoes`);
                const notas = await res.json();
                const div = document.getElementById("listaNotas");

                div.innerHTML = notas.map(n =>
                    `<div class="nota">
                        <p>${n.texto}</p>
                        <span class="data">${new Date(n.data_criacao).toLocaleString('pt-BR')}</span>
                    </div>`
                ).join("");
            } catch (e) {
                document.getElementById("listaNotas").innerText = "Erro ao carregar.";
            }
        }

        async function salvarNota() {
            const texto = document.getElementById("textoNota").value;
            if (!texto) return alert("Digite algo!");

            const res = await fetch(`${API_URL}/anotacoes`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ texto: texto })
            });

            if (res.ok) {
                document.getElementById("textoNota").value = "";
                carregarNotas();
            } else {
                alert("Erro ao salvar");
            }
        }        
        carregarNotas();
    </script>
</body>

</html>
