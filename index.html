<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administração Marcenaria Puro Tronco</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; background: #ddd; border-radius: 4px; }
        button:hover { background: #ccc; }
        .bloco { background: #f4f4f4; padding: 10px; margin-top: 10px; border-radius: 5px; }
        .data { font-size: 0.8em; color: #666; display: block; margin-top: 4px; }
        
        /* Menu de Pastas Horizontal */
        #menuPastas { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        #menuPastas button { padding: 10px 15px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 5px; font-weight: bold; white-space: nowrap; color: #333; }
        #menuPastas button:hover { background: #e0e0e0; }
        #menuPastas button.ativo { background: #4CAF50; color: white; border-color: #4CAF50; }
        
        #dropZone { border: 2px dashed #aaa; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 5px; background: #fafafa; cursor: pointer; transition: background 0.3s; }
        #dropZone.dragover { background: #e1e1e1; border-color: #333; }
        #fileInput { display: none; }

        /* NOVO: Layout em Grid 4x4 */
        #listaArquivos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Responsividade para telas de telemóvel */
        @media (max-width: 500px) { #listaArquivos { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 400px) { #listaArquivos { grid-template-columns: repeat(2, 1fr); } }

        .grid-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 120px;
        }
        .grid-item:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .grid-item.pasta { background: #e8f4fd; border-color: #bde0fe; cursor: pointer; }
        .grid-item.voltar { background: #d0e4f5; border: 1px dashed #7ba8d3; cursor: pointer; justify-content: center; }

        .file-icon { font-size: 2.5em; line-height: 1; margin-bottom: 8px; }
        .file-name {
            font-size: 0.75em;
            font-weight: bold;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 5px;
            width: 100%;
        }
        .file-meta { font-size: 0.65em; color: #666; }

        /* NOVO: Menu 3 pontinhos (Kebab Menu) */
        .menu-kebab { position: absolute; top: 2px; right: 2px; outline: none; }
        .menu-kebab-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; color: #777; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .menu-kebab-btn:hover { background: #e0e0e0; color: #333; }
        
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 28px;
            background-color: white;
            min-width: 120px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
            z-index: 10;
            border-radius: 6px;
            overflow: hidden;
            text-align: left;
            border: 1px solid #ccc;
        }
        .dropdown-content button {
            color: #333;
            padding: 10px 12px;
            width: 100%;
            border: none;
            background: none;
            text-align: left;
            border-radius: 0;
            font-size: 0.85em;
            cursor: pointer;
        }
        .dropdown-content button:hover { background-color: #f1f1f1; }
        
        /* Aparece ao passar o rato ou ao clicar (focus) no mobile */
        .menu-kebab:hover .dropdown-content,
        .menu-kebab:focus-within .dropdown-content { display: block; }

        /* NOVO: Paginação */
        #paginacao { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; }
        #paginacao button { padding: 8px 15px; }
        #paginacao button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>

<body>
    <h1>Oficina Puro Tronco</h1>

    <textarea id="textoNota" placeholder="Escreva uma anotação..."></textarea>
    <button onclick="salvarNota()">Salvar Anotação</button>

    <h2>Arquivos da Oficina</h2>
    <div id="menuPastas">Buscando pastas...</div>

    <div id="dropZone" onclick="document.getElementById('fileInput').click()"
        ondragover="event.preventDefault(); this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')" ondrop="soltarArquivo(event)">
        Arraste um arquivo aqui ou clique para selecionar
        <input type="file" id="fileInput" onchange="uploadArquivo(this.files[0])">
    </div>
    
    <div id="listaArquivos">Aguardando seleção de pasta...</div>
    <div id="paginacao"></div> <!-- Container da Paginação -->

    <h2>Anotações Salvas</h2>
    <div id="listaNotas">Carregando...</div>

    <script>
        const API_URL = "/api"; 
        
        // --- ESTADO GERAL E PAGINAÇÃO ---
        let pastasRaiz = [];
        let historicoNavegacao = []; 
        let pastaAtualId = "";
        let pastaAtualNome = "";

        // Variáveis do Grid
        let listaConteudoAtual = [];
        let paginaAtual = 1;
        const ITENS_POR_PAGINA = 16;

        function formatarTamanho(bytes) {
            if (!bytes || bytes === "0") return "0 B";
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // --- INICIALIZAÇÃO E MENUS ---
        async function inicializarPastas() {
            try {
                const res = await fetch(`${API_URL}/arquivos?t=${new Date().getTime()}`, { cache: 'no-store' });
                const dados = await res.json();
                
                pastasRaiz = dados.files.filter(f => f.mimeType === 'application/vnd.google-apps.folder' && f.name.startsWith('_'));
                const usinagem = pastasRaiz.find(p => p.name === '_Usinagem');
                
                if (usinagem) {
                    abrirPastaRaiz(usinagem.id, usinagem.name);
                } else if (pastasRaiz.length > 0) {
                    abrirPastaRaiz(pastasRaiz[0].id, pastasRaiz[0].name);
                } else {
                    document.getElementById("menuPastas").innerHTML = "Nenhuma pasta com '_' encontrada.";
                    document.getElementById("listaArquivos").innerHTML = "";
                }
            } catch (e) {
                document.getElementById("menuPastas").innerHTML = "Erro ao buscar pastas.";
            }
        }

        function renderizarMenuPastas() {
            const divMenu = document.getElementById("menuPastas");
            divMenu.innerHTML = pastasRaiz.map(p => 
                `<button class="${p.id === pastaAtualId && historicoNavegacao.length === 0 ? 'ativo' : ''}" 
                         onclick="abrirPastaRaiz('${p.id}', '${p.name}')">
                    📁 ${p.name.replace('_', '')} 
                </button>`
            ).join("");
            
            document.getElementById("dropZone").innerHTML = `Arraste um arquivo para <b>${pastaAtualNome}</b> ou clique para selecionar <input type="file" id="fileInput" onchange="uploadArquivo(this.files[0])">`;
        }

        // --- NAVEGAÇÃO DE PASTAS ---
        function abrirPastaRaiz(id, nome) {
            historicoNavegacao = [];
            pastaAtualId = id;
            pastaAtualNome = nome;
            renderizarMenuPastas();
            carregarConteudoPasta();
        }

        function entrarSubpasta(id, nome) {
            historicoNavegacao.push({ id: pastaAtualId, nome: pastaAtualNome });
            pastaAtualId = id;
            pastaAtualNome = nome;
            renderizarMenuPastas(); 
            carregarConteudoPasta();
        }

        function voltarPasta() {
            if (historicoNavegacao.length === 0) return;
            const pastaAnterior = historicoNavegacao.pop();
            pastaAtualId = pastaAnterior.id;
            pastaAtualNome = pastaAnterior.nome;
            renderizarMenuPastas();
            carregarConteudoPasta();
        }

        async function carregarConteudoPasta() {
            const div = document.getElementById("listaArquivos");
            const pagDiv = document.getElementById("paginacao");
            
            div.style.display = "block"; // Reset para a mensagem de loading
            div.innerHTML = "Carregando conteúdo...";
            pagDiv.innerHTML = "";

            try {
                const res = await fetch(`${API_URL}/arquivos?folderId=${pastaAtualId}&t=${new Date().getTime()}`, { cache: 'no-store' });
                const dados = await res.json();
                
                listaConteudoAtual = dados.files || [];
                paginaAtual = 1; // Reseta a página sempre que troca de pasta
                
                renderizarGridPagina();
            } catch (e) {
                div.innerHTML = "Erro ao carregar conteúdo da pasta.";
            }
        }

        // --- NOVO: LÓGICA DO GRID E PAGINAÇÃO ---
        function renderizarGridPagina() {
            const div = document.getElementById("listaArquivos");
            const pagDiv = document.getElementById("paginacao");
            
            let arrayManipulado = [...listaConteudoAtual];

            // Se estamos numa subpasta, inserimos o botão "Voltar" como se fosse o primeiro item do Array
            if (historicoNavegacao.length > 0) {
                const nomePai = historicoNavegacao[historicoNavegacao.length - 1].nome;
                arrayManipulado.unshift({ isVoltar: true, nomePai: nomePai });
            }

            if (arrayManipulado.length === 0) {
                div.style.display = "block";
                div.innerHTML = "A pasta está vazia.";
                pagDiv.innerHTML = "";
                return;
            }

            // Ativa o Grid
            div.style.display = "grid";

            const totalPaginas = Math.ceil(arrayManipulado.length / ITENS_POR_PAGINA);
            const start = (paginaAtual - 1) * ITENS_POR_PAGINA;
            const itensDestaPagina = arrayManipulado.slice(start, start + ITENS_POR_PAGINA);

            div.innerHTML = itensDestaPagina.map(a => {
                // Card de Voltar
                if (a.isVoltar) {
                    return `
                        <div class="grid-item voltar" onclick="voltarPasta()">
                            <div class="file-icon">⬅</div>
                            <div class="file-name">Voltar</div>
                            <div class="file-meta">${a.nomePai}</div>
                        </div>`;
                }

                // Card de Pasta
                if (a.mimeType === 'application/vnd.google-apps.folder') {
                    return `
                        <div class="grid-item pasta" onclick="entrarSubpasta('${a.id}', '${a.name}')">
                            <div class="file-icon">📁</div>
                            <div class="file-name" title="${a.name}">${a.name}</div>
                            <div class="file-meta">Pasta</div>
                        </div>`;
                } 
                
                // Card de Ficheiro (com Kebab Menu)
                return `
                    <div class="grid-item">
                        <div class="menu-kebab" tabindex="0">
                            <button class="menu-kebab-btn">⋮</button>
                            <div class="dropdown-content">
                                <button onclick="baixarArquivo('${a.id}', '${a.name}')">⬇ Baixar</button>
                                <button onclick="renomearArquivo('${a.id}', '${a.name}')">✏ Renomear</button>
                            </div>
                        </div>
                        <div class="file-icon">📄</div>
                        <div class="file-name" title="${a.name}">${a.name}</div>
                        <div class="file-meta">${formatarTamanho(a.size)}</div>
                    </div>`;
            }).join("");

            // Controles de Paginação
            if (totalPaginas > 1) {
                pagDiv.innerHTML = `
                    <button onclick="mudarPagina(-1)" ${paginaAtual === 1 ? 'disabled' : ''}>⬅ Anterior</button>
                    <span>Página ${paginaAtual} de ${totalPaginas}</span>
                    <button onclick="mudarPagina(1)" ${paginaAtual === totalPaginas ? 'disabled' : ''}>Próxima ➡</button>
                `;
            } else {
                pagDiv.innerHTML = "";
            }
        }

        function mudarPagina(delta) {
            paginaAtual += delta;
            renderizarGridPagina();
        }

        // --- UPLOAD E AÇÕES ---
        async function uploadArquivo(file) {
            if (!file) return;
            const dropZone = document.getElementById("dropZone");
            dropZone.innerText = `Preparando upload para ${pastaAtualNome}...`;
            const CHUNK_SIZE = 50 * 1024 * 1024; 

            try {
                const resUrl = await fetch(`${API_URL}/arquivos/upload-url`, {
                    method: "POST",
                    headers: {
                        "X-File-Name": encodeURIComponent(file.name),
                        "X-File-Type": file.type || "application/octet-stream",
                        "X-File-Size": file.size.toString(),
                        "X-Folder-Id": pastaAtualId
                    }
                });

                const dadosUrl = await resUrl.json();
                if (!resUrl.ok || !dadosUrl.uploadUrl) throw new Error("Falha na autorização.");

                let inicio = 0;
                while (inicio < file.size) {
                    let fim = Math.min(inicio + CHUNK_SIZE, file.size);
                    let pedaco = file.slice(inicio, fim);
                    dropZone.innerText = `Enviando ${file.name} - ${((inicio / file.size) * 100).toFixed(0)}%`;

                    let uploadRes = await fetch(dadosUrl.uploadUrl, {
                        method: "PUT",
                        headers: { "Content-Range": `bytes ${inicio}-${fim - 1}/${file.size}` },
                        body: pedaco
                    });

                    if (!uploadRes.ok && uploadRes.status !== 308) throw new Error(`Erro no bloco ${inicio}-${fim}`);
                    inicio = fim;
                }

                dropZone.innerText = "Sincronizando com o Google Drive...";

                setTimeout(() => {
                    carregarConteudoPasta(); 
                    renderizarMenuPastas(); 
                }, 2000);

            } catch (e) {
                alert("Erro no upload: " + e.message);
                renderizarMenuPastas();
            }
        }

        function baixarArquivo(id, nome) {
            window.location.href = `${API_URL}/arquivos/download/${id}?filename=${encodeURIComponent(nome)}`;
        }

        async function renomearArquivo(id, nomeAtual) {
            const indicePonto = nomeAtual.lastIndexOf('.');
            const nomeBase = indicePonto !== -1 ? nomeAtual.substring(0, indicePonto) : nomeAtual;
            const extensao = indicePonto !== -1 ? nomeAtual.substring(indicePonto) : "";

            const novoNomeBase = prompt("Novo nome (sem a extensão):", nomeBase);
            if (!novoNomeBase || novoNomeBase === nomeBase) return;

            const novoNomeFinal = novoNomeBase + extensao;

            await fetch(`${API_URL}/arquivos/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ novoNome: novoNomeFinal })
            });

            setTimeout(() => carregarConteudoPasta(), 1500);
        }

        // --- GESTÃO DE ANOTAÇÕES (D1) ---
        async function carregarNotas() {
            try {
                const res = await fetch(`${API_URL}/anotacoes?t=${new Date().getTime()}`, { cache: 'no-store' });
                const notas = await res.json();
                document.getElementById("listaNotas").innerHTML = notas.map(n =>
                    `<div class="bloco"><p>${n.texto}</p><span class="data">${new Date(n.data_criacao).toLocaleString('pt-BR')}</span></div>`
                ).join("");
            } catch (e) { document.getElementById("listaNotas").innerText = "Erro ao carregar notas."; }
        }

        async function salvarNota() {
            const texto = document.getElementById("textoNota").value;
            if (!texto) return alert("Digite algo!");
            const res = await fetch(`${API_URL}/anotacoes`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: texto }) });
            if (res.ok) { document.getElementById("textoNota").value = ""; carregarNotas(); }
            else alert("Erro ao salvar nota.");
        }

        carregarNotas();
        inicializarPastas();
    </script>
</body>
</html>
