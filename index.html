<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administracao marcenaria</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; background: #ddd; border-radius: 4px; }
        button:hover { background: #ccc; }
        .bloco { background: #f4f4f4; padding: 10px; margin-top: 10px; border-radius: 5px; }
        .data { font-size: 0.8em; color: #666; display: block; }
        .arquivo { display: flex; justify-content: space-between; align-items: center; }
        .arquivo-info { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; }
        .arquivo-acoes button { padding: 5px 10px; margin-left: 5px; font-size: 0.8em; }
        #dropZone { border: 2px dashed #aaa; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 5px; background: #fafafa; cursor: pointer; transition: background 0.3s; }
        #dropZone.dragover { background: #e1e1e1; border-color: #333; }
        #fileInput { display: none; }
    </style>
</head>

<body>
    <h1>Oficina</h1>

    <textarea id="textoNota" placeholder="Escreva uma anotação..."></textarea>
    <button onclick="salvarNota()">Salvar Anotação</button>

    <h2>Arquivos da Oficina</h2>
    <div id="dropZone" onclick="document.getElementById('fileInput').click()"
        ondragover="event.preventDefault(); this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')" ondrop="soltarArquivo(event)">
        Arraste um arquivo aqui ou clique para selecionar
        <input type="file" id="fileInput" onchange="uploadArquivo(this.files[0])">
    </div>
    <div id="listaArquivos">Carregando arquivos...</div>

    <h2>Anotações Salvas</h2>
    <div id="listaNotas">Carregando...</div>

    <script>
        const API_URL = "/api"; // Lembre-se de colocar a URL real do Worker

        // --- GESTÃO DE ARQUIVOS ---
        async function carregarArquivos() {
            try {
                // Ao adicionar "?t=" forçamos adicionalmente o navegador a ignorar o cache local
                const res = await fetch(`${API_URL}/arquivos?t=${new Date().getTime()}`);
                const dados = await res.json();
                const div = document.getElementById("listaArquivos");

                if (!dados.files || dados.files.length === 0) return div.innerText = "Nenhum arquivo no Drive.";

                div.innerHTML = dados.files.map(a =>
                    `<div class="bloco arquivo">
                        <div class="arquivo-info">
                            <strong>${a.name}</strong>
                            <span class="data">${new Date(a.createdTime).toLocaleString('pt-BR')}</span>
                        </div>
                        <div class="arquivo-acoes">
                            <button onclick="baixarArquivo('${a.id}', '${a.name}')">Baixar</button>
                            <button onclick="renomearArquivo('${a.id}', '${a.name}')">Renomear</button>
                        </div>
                    </div>`
                ).join("");
            } catch (e) {
                document.getElementById("listaArquivos").innerText = "Erro ao carregar arquivos.";
            }
        }

        function soltarArquivo(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadArquivo(e.dataTransfer.files[0]);
        }

        async function uploadArquivo(file) {
            if (!file) return;
            const dropZone = document.getElementById("dropZone");
            dropZone.innerText = "Solicitando autorização segura...";
            const CHUNK_SIZE = 10 * 1024 * 1024; // Pedaços de 10MB

            try {
                const resUrl = await fetch(`${API_URL}/arquivos/upload-url`, {
                    method: "POST",
                    headers: {
                        "X-File-Name": encodeURIComponent(file.name),
                        "X-File-Type": file.type || "application/octet-stream",
                        "X-File-Size": file.size.toString()
                    }
                });

                const dadosUrl = await resUrl.json();
                if (!resUrl.ok || !dadosUrl.uploadUrl) throw new Error("Falha na autorização.");

                let inicio = 0;
                while (inicio < file.size) {
                    let fim = Math.min(inicio + CHUNK_SIZE, file.size);
                    let pedaco = file.slice(inicio, fim);
                    dropZone.innerText = `Enviando ${file.name} - ${((inicio / file.size) * 100).toFixed(0)}%`;

                    let uploadRes = await fetch(dadosUrl.uploadUrl, {
                        method: "PUT",
                        headers: { "Content-Range": `bytes ${inicio}-${fim - 1}/${file.size}` },
                        body: pedaco
                    });

                    if (!uploadRes.ok && uploadRes.status !== 308) throw new Error(`Erro no bloco ${inicio}-${fim}`);
                    inicio = fim;
                }

                carregarArquivos();
            } catch (e) {
                alert("Erro no upload: " + e.message);
            }

            dropZone.innerHTML = `Arraste um arquivo aqui ou clique para selecionar <input type="file" id="fileInput" onchange="uploadArquivo(this.files[0])">`;
        }

        function baixarArquivo(id, nome) {
            // Envia o nome do ficheiro para o Worker reconstruir o cabeçalho
            window.location.href = `${API_URL}/arquivos/download/${id}?filename=${encodeURIComponent(nome)}`;
        }

        async function renomearArquivo(id, nomeAtual) {
            const novoNome = prompt("Novo nome:", nomeAtual);
            if (!novoNome || novoNome === nomeAtual) return;

            await fetch(`${API_URL}/arquivos/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ novoNome })
            });
            carregarArquivos();
        }

        // --- GESTÃO DE ANOTAÇÕES (D1) ---
        async function carregarNotas() {
            try {
                // Bypass de cache local para as anotações também
                const res = await fetch(`${API_URL}/anotacoes?t=${new Date().getTime()}`);
                const notas = await res.json();
                document.getElementById("listaNotas").innerHTML = notas.map(n =>
                    `<div class="bloco"><p>${n.texto}</p><span class="data">${new Date(n.data_criacao).toLocaleString('pt-BR')}</span></div>`
                ).join("");
            } catch (e) { document.getElementById("listaNotas").innerText = "Erro ao carregar notas."; }
        }

        async function salvarNota() {
            const texto = document.getElementById("textoNota").value;
            if (!texto) return alert("Digite algo!");
            const res = await fetch(`${API_URL}/anotacoes`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: texto }) });
            if (res.ok) { document.getElementById("textoNota").value = ""; carregarNotas(); } 
            else alert("Erro ao salvar nota.");
        }

        carregarNotas();
        carregarArquivos();
    </script>
</body>
</html>
